<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>坦克大战</h1>
        <div class="score-board">
            <div>玩家得分: <span id="player-score">0</span></div>
            <div>敌方坦克: <span id="enemy-count">5</span></div>
            <div>等级: <span id="level">1</span></div>
            <div>老家生命: <span id="base-health">5</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <div class="control-group">
                <h3>游戏控制</h3>
                <p>WASD 或 方向键 - 移动坦克</p>
                <p>空格键 - 发射子弹</p>
                <p>R - 重新开始</p>
                <p>P - 暂停/继续</p>
                <br>
                <h4>游戏说明</h4>
                <p>🎮 玩家坦克（绿色）在左下角</p>
                <p>🏠 守护基地（金色）不被摧毁</p>
                <p>🧱 躲避或摧毁障碍物</p>
                <p>⚡ 3级后出现强化敌方坦克（紫色）</p>
            </div>
            <div class="buttons">
                <button id="startBtn">开始游戏</button>
                <button id="pauseBtn">暂停</button>
                <button id="restartBtn">重新开始</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
